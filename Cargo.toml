[package]
name = "pdw-rs"
version = "0.1.0"
edition = "2021"
description = "Modern Rust POCSAG & FLEX Paging Decoder with 48 kHz DSP, 4-FSK, Chase-2 Soft BCH, and Local GUI"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
cpal = "0.15"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
